name: tonsoku
description: "とん速 - 松のや専門メディア"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter 内部の Cupertino ウィジェット（iOS 風の戻る・テキスト選択）が
  # CupertinoIcons を参照するため、外すと release ビルドで
  # 「Expected to find fonts for CupertinoIcons」の警告が出る。
  # 未使用ならツリーシェイクでほぼ消えるので置いておく
  cupertino_icons: ^1.0.8

  # State Management
  # flutter_hooks / riverpod_annotation は実際に使う Issue で足す。今入れると
  # riverpod_generator（analyzer ^12 を要求）まで連れてきて freezed が
  # pre-release でしか解けなくなる（gyumesy-frontend-app で踏んだ）
  hooks_riverpod: ^3.3.2

  # Routing
  go_router: ^18.0.1

  # Network（R2 の配信 JSON 取得）
  dio: ^5.10.0

  # 記事一覧のサムネイルを端末に残す。配信データと同じく、電波が悪くても
  # 前回見たものが出ることを優先する（gyumesy と同じ）
  cached_network_image: ^4.0.0

  # 記事本文のレンダリング。**表が要る**（とん速は 36 本中 34 本が表を持つ）
  # ので GFM 対応が必須（gyumesy と同じ選定）
  flutter_markdown_plus: ^1.0.12
  # 見出しの枠線・画像と出典の組み（figure）はスタイルシートで表現できないので、
  # ブロックの組み替えと MarkdownElementBuilder を自前で持つ。その引数の型
  # （md.Element / md.Node）を参照するため明示依存に置く
  markdown: ^7.3.0

  # 出典リンク・アプリに画面が無いページ（とん速とは・法務）を開く
  url_launcher: ^6.3.1
  # 記事の動画（X のポストの添付）。**配信元は自前の R2** なので、外部へ
  # 飛ばさずアプリ内で再生する（gyumesy と同じ）
  video_player: ^2.13.0

  # 記事のシェア
  share_plus: ^13.3.0

  # ロゴとのや子（web と同じ SVG を使う。PNG にすると地の白が
  # ダークテーマで四角く出る）
  flutter_svg: ^2.3.0

  # Data / Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage（設定値は shared_preferences、配信データのキャッシュはファイル）
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Utilities
  # テスト可能な時刻取得。キャッシュの鮮度判定で DateTime.now() を直接使わない
  clock: ^1.1.1

  # メニューに出すアプリバージョン。**入っている実物から読む**
  # （pubspec の値を焼き込むと、ストア用に番号だけ上げた時に食い違う。gyumesy と同じ）
  package_info_plus: ^10.2.1

  # マップ。**背景地図は同梱の PMTiles をベクターのまま描く**（`assets/map/`）。
  # 地図の土台は flutter_map、ベクタータイルの描画は vector_map_tiles。
  #
  # **vector_map_tiles は 9 のベータに固定する。** 安定版（8.0.0）は
  # flutter_map 7 までしか対応しておらず、flutter_map 8 と組めるのは 9 の
  # ベータだけ（2026-09-25 時点）。`^` を付けるとベータどうしで勝手に上がるので
  # 版を決め打ちにし、上げる時は画面で確かめてから上げる。
  # 10 のベータは描画を作り直している途中（vector_tile_renderer 7 のベータ）で採らない
  #
  # **PMTiles の読み手は自前で持つ**（`lib/features/map/data/pmtiles.dart`）。
  # 公開の vector_map_tiles_pmtiles / pmtiles はこの組と依存が解決できない
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  vector_map_tiles: 9.0.0-beta.13
  # 描き方（テーマ）を組み立てる `ThemeReader` がこちらにある
  vector_tile_renderer: ^6.1.0
  # 現在地（牛めしレーダーと同じ）
  geolocator: ^14.0.3

  # プッシュ通知（FCM のトピック購読）。**版は gyumesy-frontend-app と揃える**
  # （あちらでストア審査まで通った組）。
  # - flutter_local_notifications … Android で**前面に居る間の通知**を出す
  #   （FCM は前面では出さない。`push_bootstrap.dart`）
  # - app_settings … 拒否された時に端末の通知設定を直接開く
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.1
  app_settings: ^9.0.0
  # 広告（AdMob）。**SDK に触るのは `lib/core/ads/ad_gateway.dart` だけ**（テストは
  # そこを偽物に差し替え、本物の広告を読み込まない）。枠の ID は
  # `lib/core/config/ad_config.dart`、アプリ ID は Info.plist / AndroidManifest.xml
  google_mobile_ads: ^9.1.0
  # iOS の App Tracking Transparency の確認（広告の SDK を始める時に 1 度だけ）
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  # Testing
  mocktail: ^1.0.5

  # ランチャーアイコンの生成（`dart run flutter_launcher_icons`）。
  # 設定は末尾の `flutter_launcher_icons:` セクション
  flutter_launcher_icons: ^0.14.4

  # 時刻を進めるテスト（マップの開放の期限が、開いている間に切れるか）
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    # ヘッダーのロゴ。web の public/icon.svg と同じもの（意匠を揃える）。
    # サムネイルの無い記事の既定の絵も web の `public/images/articles/` と同じもの
    - assets/brand/
    # 同梱書体のライセンス（SIL OFL の帰属表示。`lib/core/licenses/font_licenses.dart`）
    - assets/licenses/
    # マップの背景地図（Protomaps / OpenStreetMap。約 30MB）と駅（約 390KB）。
    # 作り方は tool/build_map.sh（README の「マップの背景地図」）
    - assets/map/japan.pmtiles
    - assets/map/stations.json
    # 通知設定の見本（ライト / ダーク × 5）。web がとん速のぶんを焼いたもの
    # （`tonsoku-frontend-web/public/images/notifications/`。作り方は web の
    # `docs/notification-samples.md`）。**gyumesy の絵を流用しない**（中身が松屋側）
    - assets/notifications/

  fonts:
    # **日本語は Klee One の SemiBold 1 つで描く**（web と同じ。本文も太字も）。
    # 大正浪漫の雰囲気でとん速の"色"を出すための書体で、web の
    # `main.css` の `html[data-locale='ja']` に経緯がある。
    # 実体は web が npm で持っている Google Fonts の TTF を、
    # gyumesy の Noto と同じ字の集合（6,886 字）に切り出したもの。
    # 生成手順は tool/build_fonts.py
    #
    # **太字は縁取りで付ける**（web の `--bold-stroke: 0.035em`）。Flutter の
    # テキストは「要求した太さが**フォントファイル自身の太さ**（OS/2 の
    # usWeightClass）より 200 以上重く、かつ 600 以上」の時に合成太字（輪郭を
    # 字の大きさの 1/24〜1/32 だけ太らせる。web の縁取りとほぼ同じ量）を掛ける。
    # そこで **SemiBold の usWeightClass を 400 に書き換えて同梱している**
    # （tool/build_fonts.py）。`FontWeight.bold`（700）の所にだけ太字が掛かり、
    # 本文（400）はそのまま SemiBold で描かれる。
    # **ここの `weight:` を変えても効かない** ―― 判定が見るのはファイルの値で、
    # 600 のままだと 700 との差が 100 になり、太字が本文と同じ太さに戻る
    # （実際にそうなっていた）
    - family: Klee One
      fonts:
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 400
    # **英語・中国語は Noto Sans JP**（web と同じ。中国語の簡体字で
    # 収録外の字は OS の書体へ落ちる）。gyumesy-frontend-app と同じ実体
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

# アプリアイコン。**元は web の `public/icon.svg`**（赤い丸＋白い字の 1 枚）。
# **作りは web の `scripts/lib/icons.ts` に揃える**（web のユーザーの方針で、
# アプリのアイコンもこの意匠をそのまま使う）。`assets/icon/` の 2 枚の作り方は README。
flutter_launcher_icons:
  android: true
  ios: true
  # **iOS は白いタイルの中央に、一辺の 0.805 の丸**（web の `apple-touch-icon.png` と
  # 同じ。`IOS_CIRCLE_RATIO`）。**四隅の白がはっきり出る所まで引く** ―― 丸を
  # 目いっぱい（1.0）にすると iOS の角丸に丸の縁が切られ、web でも「窮屈」と
  # 指摘されて 0.805 にした（アプリでも一度 1.0 で作り、ユーザーに却下された）。
  # **丸は SVG のものを使わず描き直す**（SVG の丸は下と右が数単位届いておらず、
  # 白地だと縁に白い線が残る。web の注記）
  #
  # **これが使われるのは iOS 25 以前だけ。** iOS 26 以降は
  # `ios/Runner/AppIcon.icon`（Icon Composer の形式）が使われる。この形式の
  # アイコンを置かないと、iOS 26 は 1 枚絵のアイコンに**既定のガラスの加工を
  # 重ね**、赤い丸が透けて下が白っぽくぼやける（実機で出た。白地が大半の
  # ギュメシーでは目立たない）。**AppIcon.icon はガラス・透け・ハイライト・
  # 影をすべて切ってあり**、この 1 枚と同じ絵がそのまま出る（README）
  image_path: "assets/icon/icon.png"
  # iOS は透過を許さない（App Store の検証で弾かれる）
  remove_alpha_ios: true
  # **Android は丸い印だけ**（ユーザーの指示。白いタイルを敷かない）。
  # アダプティブに対応しない古い端末の `ic_launcher.png` は、角が透明な丸ごとの印
  # （web の `plain`。`icon-512x512.png` と同じ作り）
  image_path_android: "assets/icon/icon_android.png"
  # **Android のアダプティブアイコンは、赤の地に字だけを置く**（web の maskable と
  # 同じ考え方。web のユーザーの判断「Android は丸なんだからロゴをそのまま
  # アイコンに」「白枠を付けるな」）。前景は丸を落とした字だけで、丸は地の赤が担う。
  # 前景のキャンバス（108dp）のうち見える窓は 72dp（66.7%）。**字が窓のふちに
  # わずかに届く大きさ**にする（web の `MASKABLE_VISIBLE_CIRCLE` と同じく、
  # 隙間が空くより髪の毛ほど削れるほうが元の絵に近い）。inset 16% で字の外縁は
  # 窓の 1.02 倍（17% だと 0.99 倍で赤い輪が残る）
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#A7232A"
  adaptive_icon_foreground_inset: 16
