<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
html,body{width:1024px;height:500px}
.stage{width:1024px;height:500px}

/* web の OGP（`tonsoku-frontend-web/scripts/lib/ogp-template.ts`）と同じ枠。
   **赤の 1 色**（gyumesy は 2 色を辺ごとに割っているが、とん速の差し色の緑は
   カテゴリの意味に使っている色なので、枠に混ぜると意味を持って見える）。
   太さは OGP の 14px（1200 幅）を横幅比で 12px に取り直した。
   **端末より上に置く**（端末のはみ出しを枠が押さえる。OGP のスタンプと同じ） */
.f{position:absolute;inset:0;border:12px solid var(--primary);z-index:5}

/* 左: ロゴ＋サービス名＋キャッチ（OGP の既定面と同じ並び） */
/* ロゴ・サービス名・キャッチをひと塊にして**縦中央**に置く */
.left{position:absolute;left:74px;top:50%;transform:translateY(-50%)}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:74px;height:74px;display:block}
.brand span{font-size:64px;letter-spacing:0.02em;line-height:1;
  font-weight:600;-webkit-text-stroke:0.024em currentColor}
/* **キャッチは web の `site.tagline`**（「松のや速報」）。**Play だけの画像**なので
   「松のや」を出してよい（Play は掲載文の冒頭にも出している。docs/release.md の
   「提出前の確認」）。App Store の画像には使わない */
.tag{margin-top:30px;margin-left:4px;font-size:28px;color:var(--sub);line-height:1;
  -webkit-text-stroke:0.024em currentColor}
.lead{margin-top:18px;margin-left:4px;font-size:22px;color:var(--sub);line-height:1.5}

/* 右: 端末。**下にブリード**（スクショ側と同じ作り）。画面は 1 枚目と同じマップ */
.device{position:absolute;left:660px;top:62px;transform:rotate(-11deg)}
.frame{border-radius:44px;padding:7px}
.frame img{width:300px;border-radius:38px;display:block}
</style></head>
<body>
<div class="stage">

  <div class="left">
    <div class="brand"><img src="assets/icon.svg"><span>とん速</span></div>
    <div class="tag">松のや速報</div>
    <div class="lead">店舗限定メニューを扱う店を、地図で探せる</div>
  </div>

  <div class="device"><div class="frame">
    <img src="../source/map_ios.png"></div></div>

  <div class="f"></div>
</div>
</body></html>
