<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../_base.css">
<style>
html,body{width:1080px;height:1920px}
/* 1290 の窓に 2580 の世界を流し込み、#b で右半分に送る。
   **またぐのは端末ではなく世界**（背景の円）。端末は 2 台置く */
.viewport{position:relative;width:1080px;height:1920px;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:2160px;height:1920px}
body.b .stage{left:-1080px}

.blob.b1{width:938px;height:769px;left:-218px;top:-110px;opacity:.10}
.blob.b2{width:753px;height:618px;left:1658px;top:1222px;opacity:.10}
.blob.b3{width:435px;height:357px;left:1189px;top:206px;opacity:.07}

/* コピーは 1 枚目だけ。**2 行を塊にする**（行間を詰める） */
/* **2 台目より上に置く。** 端末に重ねると 2 行目が読めない */
/* **1 枚目の中に 2 行で収める。** 継ぎ目をまたぐと 2 枚目に切れ端が出る */
.catch{position:absolute;font-size:74px;line-height:1.52;z-index:3}
/* 左上 */
.catch.a{left:100px;top:137px}
/* 右下（2 枚目の右下）。**継ぎ目をまたがない** */
/* **行末の句点は全角の左寄りグリフ**で、そのままだと右端が内側に入り
   中央寄せに見える。ぶら下げて右端を揃える */
.catch.b{right:100px;bottom:151px;text-align:right}
.catch .hang{margin-right:-0.5em}

/* 1 台目: 1 枚目の下半分。傾き強め・下は切る */
/* 奥。**下にずらし、傾き強め。** 右上が手前に隠れる。右端は継ぎ目に少し被る程度 */
.d1{left:354px;top:601px;transform:rotate(-18deg);z-index:1}
.d1 .frame{border-radius:65px;padding:12px}
.d1 .frame img{width:737px;border-radius:59px}

/* 手前の 1 台。**別角度で重ねる**（SmartNews と同じ作り）。
   継ぎ目をまたぐのはこちら */
/* 手前。**奥より上・右・大きい。** 継ぎ目がこの端末を切り、2 枚目の主役になる */
.d2{left:934px;top:124px;transform:rotate(15.2deg);z-index:2}
.d2 .frame{border-radius:65px;padding:12px}
.d2 .frame img{width:668px;border-radius:54px}
</style></head>
<body>
<div class="viewport"><div class="stage">
  <div class="blob red b1"></div>
  <div class="blob brown b2"></div>
  <div class="blob red b3"></div>

  <!-- **見出しは iOS 判と同じ**（「松のや」を出さない。理由は `../pair12.html`） -->
  <div class="catch a">店舗限定の
<span class="thin">㊙</span>メニューが、</div>
  <div class="catch b">地図で見つかる<span class="hang">。</span></div>

  <!-- 画面は Android の寸法で組んだもの（`screens/`。`?d=android`） -->
  <div class="device d1"><div class="frame">
    <img src="../../source/map_android.png"></div></div>
  <div class="device d2"><div class="frame">
    <img src="../../source/shop_android.png"></div></div>
</div></div>
<script>if(location.search.indexOf('b')>=0)document.body.classList.add('b')</script>
<script src="../_stamps.js"></script>
<script src="../_fit.js"></script>
</body></html>
