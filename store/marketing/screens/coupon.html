<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="_screen.css">
<style>
/* クーポン（`coupon_page.dart`）を「現在使えるクーポン」まで送ったところ。
 * **ロゴのバーは畳まれている**（アプリは下へ送るとロゴのバーが上へ退く。
 * `header_hide_controller.dart`）。寸法はアプリの画面（iPhone 17 Pro）を実測したもの。
 * 広告の枠は描かない（理由は `home.html`）。 */

.status { background: var(--bg); border-bottom: 1px solid var(--border); }
.body { flex: 1; overflow: hidden; background: var(--surface); padding: 0 16px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 0 10px;
  border-bottom: 2px solid var(--primary); }
.sec-h h2 { font-size: 21px; letter-spacing: .1em; -webkit-text-stroke: .025em currentColor; }
.sec-h .at { font-size: 12px; color: var(--sub); letter-spacing: .06em; }

.row { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--border); }
.row .icon { position: relative; flex: none; width: 48px; height: 48px; }
.row .icon > img { width: 48px; height: 48px; border-radius: 10px; display: block; }
.row .badge { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 6px;
  border: 1.5px solid #fff; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
.row .badge img { width: 100%; height: 100%; display: block; }
.row .badge.bag { border-color: var(--border); }
.row .badge i { width: 14px; height: 14px; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-size: 15.5px; letter-spacing: .08em; -webkit-text-stroke: .02em currentColor; }
.row .t.mark { margin-left: -6px; }
.row .kv { margin-top: 6px; font-size: 11px; line-height: 1.55; color: var(--sub); letter-spacing: .08em; }
.row .kv b { color: var(--text); margin-right: 5px; -webkit-text-stroke: .02em currentColor; }
.row .kv s { text-decoration: none; color: #CFC6BD; margin: 0 4px; }
.row .btns { display: flex; gap: 7px; margin-top: 10px; }
.row .btn { display: flex; align-items: center; gap: 6px; height: 23px; padding: 0 10px; border-radius: 12px;
  border: 1.2px solid var(--border); font-size: 11px; color: var(--sub); letter-spacing: .06em; }
.row .btn.code { border-color: #8A6A1F; color: #8A6A1F; }
.row .btn i { width: 13px; height: 13px; }
.row .amt { flex: none; width: 104px; text-align: right; font-size: 16.5px; line-height: 1.3; letter-spacing: 0; }

.best { margin-top: 18px; border: 1px solid var(--border); border-radius: 16px; padding: 24px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; }
.best .part { display: flex; align-items: center; gap: 12px; }
.best .part img { width: 32px; height: 32px; border-radius: 7px; }
.best .part .nm { font-size: 14px; letter-spacing: .08em; }
.best .part .pc { font-size: 18px; }
.best .note { font-size: 11px; color: var(--sub); letter-spacing: .1em; }
.best .op { font-size: 18px; color: var(--sub); line-height: 1; margin: 2px 0; }
.best .total { display: flex; align-items: baseline; gap: 8px; color: var(--primary-text); }
.best .total b { font-size: 40px; line-height: 1; -webkit-text-stroke: .02em currentColor; }
.best .total span { font-size: 18px; letter-spacing: .1em; }
</style>
</head>
<body data-d="phone" data-nav="coupon">
<div class="screen">
  <div class="status"></div>

  <!-- 中身は配信の写し（`store/fixtures/coupon.json`。2026-09-26） -->
  <div class="body">
    <div class="sec-h"><h2>現在使えるクーポン</h2><span class="at">2026年9月26日 時点</span></div>

    <div class="row">
      <div class="icon"><img src="../../fixtures/img/matsuya.webp" alt=""><span class="badge"><img src="../../fixtures/img/tiktok.webp" alt=""></span></div>
      <div class="main">
        <div class="t mark">【TikTok】食欲の秋</div>
        <div class="kv"><b>期限</b>〜9/30 15:00</div>
        <div class="kv" style="margin-top:2px"><b>条件</b>対象: ダブルロースかつ定食ほか計3品<s>/</s>券売機のみ<s>/</s>一部店舗を除く松のや・松屋松のや併設店で利用可</div>
        <div class="btns"><span class="btn code">QRコード<i data-i="qr"></i></span><span class="btn">詳細画像<i data-i="zoom"></i></span></div>
      </div>
      <div class="amt">280〜360円<br>引き</div>
    </div>

    <div class="row">
      <div class="icon"><img src="../../fixtures/img/matsuya.webp" alt=""><span class="badge"><img src="../../fixtures/img/x.webp" alt=""></span></div>
      <div class="main">
        <div class="t mark">【X】秋の丼祭り</div>
        <div class="kv"><b>期限</b>終了未定</div>
        <div class="kv" style="margin-top:2px"><b>条件</b>対象: ロースかつ丼ほか計6品<s>/</s>券売機のみ<s>/</s>まとめ買いで10%OFF</div>
        <div class="btns"><span class="btn code">QRコード<i data-i="qr"></i></span><span class="btn">詳細画像<i data-i="zoom"></i></span></div>
      </div>
      <div class="amt">140〜200円<br>引き</div>
    </div>

    <div class="row">
      <div class="icon"><img src="../../fixtures/img/matsuya.webp" alt=""><span class="badge bag"><i data-i="bag"></i></span></div>
      <div class="main">
        <div class="t">松弁ネット2倍</div>
        <div class="kv"><b>期限</b>〜9/28 23:00</div>
        <div class="kv" style="margin-top:2px"><b>時間帯</b>18:00〜23:00</div>
        <div class="kv" style="margin-top:2px"><b>条件</b>受取日時が基準</div>
      </div>
      <div class="amt">12%〜40%</div>
    </div>

    <div class="sec-h" style="padding-top:34px"><h2>現在の最大還元率</h2></div>
    <div class="best">
      <div class="part"><img src="../../fixtures/img/matsuya.webp" alt=""><span class="nm">松弁ネット2倍</span><span class="pc">40%</span></div>
      <div class="note">ブラック会員20%想定</div>
      <div class="op">⇓</div>
      <div class="total"><b>40%</b><span>還元</span></div>
    </div>
  </div>

  <div class="nav"></div>
</div>
<script src="_common.js"></script>
</body></html>
